# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/spicebag
    binary: spicebag
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  make_latest: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs[:(]"
      - "^test[:(]"
      - "^chore[:(]"
      - "^Merge "

brews:
  - name: spicebag
    repository:
      owner: oxGrad
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/oxGrad/spicebag"
    description: "Season every application perfectly — CV and cover letter manager for Claude Code"
    license: MIT
