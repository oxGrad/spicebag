version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
        - os.Remove

  exclusions:
    rules:
      # Test setup code doesn't need rigorous error checking.
      - path: _test\.go
        linters:
          - errcheck
      # Deferred/inline Close calls are idiomatic; errors are unactionable at that point.
      - text: "Error return value of `[^`]*Close[^`]*` is not checked"
        linters:
          - errcheck
      # Deferred Rollback is standard Go pattern; intentionally ignored.
      - text: "Error return value of `[^`]*Rollback[^`]*` is not checked"
        linters:
          - errcheck
      # ResponseWriter.Write errors are unactionable after headers are sent.
      - text: "Error return value of `[^`]*Write[^`]*` is not checked"
        linters:
          - errcheck
      # JSON encoding to a response writer — same reasoning as Write.
      - text: "Error return value of `[^`]*Encode[^`]*` is not checked"
        linters:
          - errcheck
